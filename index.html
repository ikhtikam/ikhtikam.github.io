<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKHTIKAM HEBAT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0b10',
                        cyanGlow: '#00f0ff',
                        pinkGlow: '#ff0055',
                        purpleGlow: '#7000ff'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>


    
    <style>

	    /* Smooth Custom Styling */
        body {
            background-color: #0a0b10;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Glowing Cursor Blur Trail */
        #glow-trail {
            pointer-events: none;
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(112, 0, 255, 0.06) 40%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: transform 0.08s ease-out;
        }
	.blob-1 {
            position: absolute;
            top: 15%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: rgba(0, 240, 255, 0.15);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
        }
        .blob-2 {
            position: absolute;
            bottom: 20%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: rgba(255, 0, 85, 0.12);
            filter: blur(140px);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>

<body class="relative min-h-screen flex flex-col justify-between selection:bg-cyanGlow selection:text-black">

    <!-- Ambient Glowing Cursor & Background Lights -->
    <div id="glow-trail"></div>
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <script>
             // Smooth Cursor Following Glowing Backdrop
        const glowTrail = document.getElementById('glow-trail');
        window.addEventListener('mousemove', (e) => {
            glowTrail.style.left = `${e.clientX}px`;
            glowTrail.style.top = `${e.clientY}px`;
        });
    </script>
        
    </body>
</html>
